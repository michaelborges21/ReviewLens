name: CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    name: Lint, tipos e testes (bloqueia)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run ruff check src tests app
      - run: uv run ruff format --check src tests app
      - run: uv run mypy src/
      - run: uv run pytest -q          # sem chamadas reais a LLM (fakes)

  # Dois jobs foram removidos e o CI ficou só com `quality`:
  #   llm-gates (ADR-008) — exigia GPU que o runner não tem; o modelo do projeto é local.
  #   ai-review (ADR-011) — dependia de ANTHROPIC_API_KEY, e o projeto não usa chave de API.
  # Com isso o CI não precisa de nenhum segredo de repositório.

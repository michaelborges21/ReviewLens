version: "3.8"

services:
  app:
    build: .
    container_name: reviewlens_app
    ports:
      - "8000:8000"
    environment:
      # Aponta para o serviço do Ollama no docker-compose
      - OLLAMA_URL=http://ollama:11434
    volumes:
      # Mapeia as pastas locais para persistir relatórios e o banco DuckDB
      - ./data:/app/data
      - ./reports:/app/reports
    depends_on:
      - ollama
    restart: unless-stopped

  ollama:
    image: ollama/ollama:latest
    container_name: reviewlens_ollama
    ports:
      - "11434:11434"
    volumes:
      # Volume nomeado para não baixar o modelo de novo a cada restart
      - ollama_data:/root/.ollama
    restart: unless-stopped

volumes:
  ollama_data:

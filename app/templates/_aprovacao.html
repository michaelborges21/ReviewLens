{% if candidato %}
<span class="recusa">
  Aprovado e exportado: <code>{{ prefixo }}…</code> — linha gravada em
  <code>reports/exports/</code>.
</span>
{% else %}
<span class="recusa">
  Não encontrado: <code>{{ prefixo }}…</code> não corresponde mais a um candidato elegível.
  Nada foi exportado.
</span>
{% endif %}

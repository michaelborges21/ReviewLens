default_stages: [pre-commit]

repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: uv run ruff check
        language: system
        types: [python]
      - id: ruff-format
        name: ruff format --check
        entry: uv run ruff format --check
        language: system
        types: [python]
      - id: eval-smoke
        name: eval-smoke (somente se o push alterar prompts)
        entry: make eval-smoke
        language: system
        pass_filenames: false
        stages: [pre-push]
        files: ^src/bri/prompts/
